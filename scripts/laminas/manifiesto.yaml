# Láminas a buscar en Wikimedia Commons para las fichas que todavía no tienen.
#
# «buscar»: nombre científico de la ficha y sinónimos aceptados, en el orden en
#   que se prueban. El script busca primero en la obra de Köhler (1887, dominio
#   público) una lámina titulada «<nombre> - Köhler–s Medizinal-Pflanzen-NNN».
# «archivo»: si se conoce una lámina concreta de otra obra de dominio público
#   (Curtis's Botanical Magazine, Flora Batava, Thomé…), se pone acá el título
#   exacto («File:...») después de revisarla a mano. Con ella van:
#     especie   la especie que muestra la lámina (comparada con la ficha)
#     autor, obra, anio, origen   los créditos (Commons los trae incompletos)
#     licencia  solo después de verificar a mano que es dominio público
#     recorte   [x0, y0, x1, y1] en fracciones, para sacar reglas o márgenes
# «nota»: aclaración que se muestra con la lámina (ficha de género, sinónimos,
#   o ficha con dos especies y lámina de una sola).
#
# Sinónimos verificados: Matricaria recutita = M. chamomilla; Mentha piperita =
# M. × piperita; Salvia rosmarinus = Rosmarinus officinalis; Aloysia citrodora /
# Lippia citriodora / Verbena triphylla = Aloysia citriodora; Ocimum sanctum =
# O. tenuiflorum; Physalis somnifera = Withania somnifera; Aloe vulgaris = Aloe
# vera; Hydnum erinaceus = Hericium erinaceus; Polyporus frondosus = Grifola
# frondosa.
#
# Revisadas y descartadas (2026-09-22):
# - astragalo: no se encontraron láminas antiguas de Astragalus membranaceus en Commons.
# - shiitake: no se encontraron láminas antiguas de dominio público (la ficha usa la del maitake).
# - tulsi: la única lámina (Blanco, Flora de Filipinas, 2.257) figura en Commons
#   como Ocimum tenuiflorum, O. canum y Ocimum sp.: la especie es dudosa.
# - pasionaria: Curtis's Botanical Magazine t. 3697 y Botanical Register t. 332
#   no confirman la especie y sus hojas no son las de P. incarnata; la del Códice
#   de Gottorf parece P. caerulea.
# - sabila: la de Medical Botany (rawpixel) es CC BY-SA, no dominio público; la
#   del Códice de Gottorf no parece Aloe vera.
