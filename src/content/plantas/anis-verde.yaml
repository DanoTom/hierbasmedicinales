familia: { nombre: Apiaceae, agregado: true }
compuestoActivo: { texto: "Anetol (aceite esencial)", de: guia-digestiva/8 }
acciones: { lista: [Carminativa, Antiespasmódica suave], de: guia-digestiva/8 }
partes:
  - { parte: frutos, de: guia-digestiva/8 }
usos:
  - texto: "Meteorismo, flatulencias, espasmos digestivos leves, digestión lenta."
