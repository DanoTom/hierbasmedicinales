    de: taller-digestivo/8
efectosAdversos:
  - texto: "Raramente: reacciones alérgicas en personas sensibles a la familia Apiaceae."
    de: guia-digestiva/8
interacciones:
  - texto: "No se conocen interacciones significativas a dosis habituales."
    de: guia-digestiva/8
formaDeUso:
  - texto: "Infusión de frutos: 1 cucharadita por taza, después de las comidas. También como condimento en preparaciones culinarias."
